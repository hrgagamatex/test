<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Database Karyawan</title>
  <style>
    :root{--navy:#123a68;--blue:#1976d2;--line:#d8e1ea;--text:#172333;--muted:#627184;--danger:#b42318;--ok:#067647}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(145deg,#e7eef6,#f8fafc);color:var(--text);font-family:Arial,sans-serif;padding:24px 14px}.shell{width:min(680px,100%);margin:auto}.brand{display:flex;align-items:center;gap:13px;margin:0 0 18px 4px}.mark{width:46px;height:46px;border-radius:14px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:800;font-size:20px}.brand h1{font-size:21px;margin:0}.brand p{margin:3px 0 0;color:var(--muted);font-size:14px}.card{background:#fff;border-radius:22px;box-shadow:0 18px 45px #123a6817;padding:clamp(20px,5vw,34px)}h2{font-size:26px;margin:0 0 8px}.intro{margin:0 0 26px;color:var(--muted);line-height:1.55}label{display:block;font-size:14px;font-weight:700;margin:0 0 8px}.search-wrap{position:relative}.input{width:100%;min-height:50px;border:1px solid var(--line);border-radius:13px;padding:13px 15px;font:inherit;outline:none}.input:focus{border-color:var(--blue);box-shadow:0 0 0 4px #1976d21a}.input[readonly]{background:#f6f8fb}.results{position:absolute;z-index:5;top:calc(100% + 6px);left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:13px;box-shadow:0 14px 30px #17233322;max-height:250px;overflow:auto;display:none}.results.show{display:block}.result{display:block;width:100%;border:0;border-bottom:1px solid #eef2f6;background:#fff;padding:13px 15px;text-align:left;font:inherit;cursor:pointer}.result:hover{background:#edf5fd}.empty{padding:14px;color:var(--muted)}.details{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:22px}.full{grid-column:1/-1}.btn{width:100%;min-height:52px;margin-top:26px;border:0;border-radius:13px;background:var(--navy);color:#fff;font-weight:700;font-size:16px;cursor:pointer}.btn:disabled{opacity:.55}.status{display:none;margin-top:17px;padding:13px 15px;border-radius:12px}.status.show{display:block}.status.error{background:#fef3f2;color:var(--danger)}.status.ok{background:#ecfdf3;color:var(--ok)}@media(max-width:540px){.details{grid-template-columns:1fr}.full{grid-column:auto}}
  </style>
</head>
<body>
  <main class="shell"><header class="brand"><div class="mark">G</div><div><h1>Database Karyawan</h1><p>PT Gamatex</p></div></header>
    <section class="card"><h2>Temukan data Anda</h2><p class="intro">Ketik minimal dua huruf, lalu pilih nama yang sesuai.</p>
      <form id="form"><div class="search-wrap"><label for="nama">Nama Karyawan</label><input class="input" id="nama" autocomplete="off" placeholder="Ketik nama karyawan" required><div id="results" class="results"></div></div>
        <div class="details"><div><label for="nik">NIK</label><input class="input" id="nik" readonly></div><div><label for="bagian">Bagian</label><input class="input" id="bagian" readonly></div><div class="full"><label for="jabatan">Jabatan</label><input class="input" id="jabatan" readonly></div></div>
        <button class="btn" id="submit" disabled>Kirim Data</button><div id="status" class="status"></div>
      </form>
    </section>
  </main>
  <iframe name="formTarget" hidden></iframe>
  <script>
    const API='https://script.google.com/macros/s/AKfycbyrOuvyOvEftL6e2guwQIxh04pwG_FqqrRlX5NOpnZA0TZbXdk71WybgDjnYjj22Z7R/exec';
    const FORM='https://docs.google.com/forms/d/e/1FAIpQLSeKmvRS4eHSkPywcVfxEVltvCJgO4IVnwpJapJ5LHnB8ks9yg/formResponse';
    const el={form:document.querySelector('#form'),nama:document.querySelector('#nama'),nik:document.querySelector('#nik'),bagian:document.querySelector('#bagian'),jabatan:document.querySelector('#jabatan'),results:document.querySelector('#results'),submit:document.querySelector('#submit'),status:document.querySelector('#status')};let selected='',timer;
    function api(params){return new Promise((resolve,reject)=>{const cb='cb_'+Date.now()+'_'+Math.random().toString(36).slice(2);const script=document.createElement('script');const cleanup=()=>{delete window[cb];script.remove()};window[cb]=value=>{cleanup();value.ok?resolve(value.data):reject(new Error(value.message))};script.onerror=()=>{cleanup();reject(new Error('API tidak dapat dihubungi. Pastikan Apps Script sudah diterapkan sebagai versi baru.'))};script.src=API+'?'+new URLSearchParams({...params,callback:cb});document.body.appendChild(script)})}
    function message(text,type){el.status.textContent=text;el.status.className='status show '+type}function reset(){selected='';el.nik.value='';el.bagian.value='';el.jabatan.value='';el.submit.disabled=true}
    el.nama.addEventListener('input',()=>{reset();clearTimeout(timer);const q=el.nama.value.trim();if(q.length<2){el.results.className='results';return}el.results.innerHTML='<div class="empty">Mencari…</div>';el.results.className='results show';timer=setTimeout(async()=>{try{const rows=await api({action:'search',q});el.results.innerHTML=rows.length?'':'<div class="empty">Nama tidak ditemukan.</div>';rows.forEach(row=>{const b=document.createElement('button');b.type='button';b.className='result';b.textContent=row.nama;b.onclick=()=>choose(row.nama);el.results.appendChild(b)})}catch(e){message(e.message,'error')}},300)});
    async function choose(name){el.nama.value=name;el.results.className='results';try{const row=await api({action:'get',name});selected=row.nama;el.nik.value=row.nik;el.bagian.value=row.bagian;el.jabatan.value=row.jabatan;el.submit.disabled=false}catch(e){message(e.message,'error')}}
    el.form.addEventListener('submit',e=>{e.preventDefault();if(!selected)return;const f=document.createElement('form');f.method='POST';f.action=FORM;f.target='formTarget';[['entry.2005620554',selected],['entry.1166974658',el.nik.value],['entry.839337160',el.bagian.value],['entry.134342005',el.jabatan.value]].forEach(([n,v])=>{const i=document.createElement('input');i.type='hidden';i.name=n;i.value=v;f.appendChild(i)});document.body.appendChild(f);f.submit();f.remove();el.submit.disabled=true;message('Data berhasil dikirim.','ok')});
  </script>
</body>
</html>
